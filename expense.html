<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses | StudentHub</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:900px;margin:auto;padding:24px 18px}.panel{background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{padding:14px 0;border-bottom:1px solid #e8ebf2;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.row p{margin:5px 0;color:#657087}.delete{background:#b42318}.total{font-size:1.8rem;font-weight:800;color:#5367f5}.back{color:#5367f5;text-decoration:none;font-weight:bold}</style></head><body><main class="wrap"><a class="back" href="index.html">← Dashboard</a><section class="panel"><h1>Expense Tracker</h1><p>Uses your existing <code>studentExpenses</code> data.</p><div class="total" id="total">₦0</div><p>Total recorded</p></section><section class="panel"><h2>Add expense</h2><form id="form"><div class="grid"><div><label for="expenseName">Expense</label><input id="expenseName" maxlength="100" required placeholder="Transportation"></div><div><label for="expenseAmount">Amount (₦)</label><input id="expenseAmount" type="number" min="1" step="0.01" required></div><div><label for="category">Category</label><select id="category"><option>Food</option><option>Transport</option><option>School</option><option>Data</option><option>Accommodation</option><option>Other</option></select></div><button type="submit">+ Add expense</button></div><p id="status" aria-live="polite"></p></form></section><section class="panel"><h2>Expenses</h2><div id="list"></div></section></main><script src="expense.js"></script></body></html>
