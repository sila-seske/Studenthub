<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner | StudentHub</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:900px;margin:auto;padding:24px 18px}.panel{background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:18px;margin-top:18px}.row{padding:12px 0;border-bottom:1px solid #e8ebf2}.back{color:#5367f5;text-decoration:none;font-weight:bold}</style></head><body><main class="wrap"><a class="back" href="index.html">← Dashboard</a><section class="panel"><h1>Study Planner</h1><p>Name: <strong id="name"></strong></p><p>Preferred time: <strong id="pref"></strong></p><p>Daily duration: <strong id="duration"></strong></p></section><section class="panel"><h2>Add study session</h2><label for="date">Date</label><input id="date" type="date" required><label for="course">Course / topic</label><input id="course" maxlength="120" placeholder="Electromagnetic Fields" required><label for="start">Start time</label><input id="start" type="time" required><label for="minutes">Duration (minutes)</label><input id="minutes" type="number" min="5" max="600" value="60" required><button id="save">Save session</button><p id="status" aria-live="polite"></p></section><section class="panel"><h2>Saved sessions</h2><div id="sessions"></div></section><section class="panel"><h2>Classes on selected date</h2><div id="classes"></div></section></main><script src="study.js"></script></body></html>
