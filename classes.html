<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classes | StudentHub</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:900px;margin:auto;padding:24px 18px}.panel{background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{padding:14px 0;border-bottom:1px solid #e8ebf2;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.row p{margin:5px 0;color:#657087}.delete{background:#b42318}.back{color:#5367f5;text-decoration:none;font-weight:bold}</style></head><body><main class="wrap"><a class="back" href="index.html">← Dashboard</a><section class="panel"><h1>My Classes</h1><p>Manage your classes here.</p><form id="classFormPage"><div class="grid"><div><label for="courseName">Course name</label><input id="courseName" required maxlength="100" placeholder="CSC 201"></div><div><label for="classDay">Day</label><select id="classDay"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></div><div><label for="startTime">Start time</label><input id="startTime" type="time" required></div><div><label for="endTime">End time</label><input id="endTime" type="time" required></div><div><label for="classRoom">Room</label><input id="classRoom" maxlength="100" placeholder="B12"></div><button type="submit">+ Save class</button></div><p id="status" aria-live="polite"></p></form></section><section class="panel"><h2>Weekly timetable</h2><div id="classListPage"></div></section></main><script src="classes.js"></script></body></html>
