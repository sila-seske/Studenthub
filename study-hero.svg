<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="A student studying at a desk" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.float{animation:float 6s ease-in-out infinite}
.glow{animation:glow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nod{animation:nod 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.turn{animation:turn 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.scribble{animation:scribble 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
.rise{animation:rise 7s linear infinite;opacity:0}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes turn{0%,55%,100%{transform:scaleX(1)}25%{transform:scaleX(.1)}}
@keyframes scribble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-200px);opacity:0}}
</style>
<circle class="glow" cx="500" cy="150" r="140" fill="#2ec4b6"/>
